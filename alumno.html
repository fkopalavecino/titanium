<script>
(async () => {
const sb = window.__sb;
const $ = s => document.querySelector(s);
const esc = x => String(x == null ? '' : x).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const toISO = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => toISO(new Date());
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return toISO(d); };
const diffDays = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 864e5);
const DK = ['dom','lun','mar','mie','jue','vie','sab'];
const DL = {dom:'Dom',lun:'Lun',mar:'Mar',mie:'Mié',jue:'Jue',vie:'Vie',sab:'Sáb'};
const MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const dayKey = s => DK[parseISO(s).getDay()];
const fmtD = s => s ? parseISO(s).getDate() + ' ' + MES[parseISO(s).getMonth()].slice(0, 3) : '—';
const longD = s => { const d = parseISO(s); return ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'][d.getDay()] + ' ' + d.getDate() + ' de ' + MES[d.getMonth()]; };
const clp = n => '$' + Math.round(Number(n) || 0).toLocaleString('es-CL');
const hm = s => { const [h, m] = String(s).split(':').map(Number); return h * 60 + (m || 0); };
const nowM = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const toast = m => { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2800); };
const S = { v: 'hoy', wk: null, dia: null, a: null, planes: [], clases: [], rutinas: new Map(), cfg: {}, sel: null, eventos: [], fotos: [], medidas: [], inbody: [], urls: {}, fang: 'frente' };

/* invitación de Franco: el link trae ?i=CÓDIGO; se guarda para usarlo después de entrar con el correo */
try { const qi = new URLSearchParams(location.search).get('i'); if (qi) { localStorage.setItem('tl-inv', qi.trim().toUpperCase()); history.replaceState(null, '', location.pathname); } } catch (_) {}
const invGuardada = () => { try { return localStorage.getItem('tl-inv'); } catch (_) { return null; } };
/* guía de instalación: si abrió el link en el navegador (no desde el ícono), primero le mostramos cómo dejarla en su pantalla */
const enApp = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const movil = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
if (movil && !enApp && !(await window.__sb.auth.getSession()).data?.session) { // en el computador se puede usar desde el navegador
  const ua = navigator.userAgent; const esAndroid = /Android/i.test(ua);
  const iosOtro = !esAndroid && /CriOS|FxiOS|EdgiOS/i.test(ua); // Chrome / Firefox / Edge en iPhone
  const enWA = /WhatsApp|FBAN|FBAV|Instagram/i.test(ua) || (esAndroid && /; wv\)/.test(ua));
  const caja = (n, t, d) => `<div style="display:flex;gap:14px;align-items:flex-start;background:linear-gradient(135deg,#1f1a1e,#161317);border:1px solid #2f2a2e;border-left:5px solid #d71f30;border-radius:16px;padding:14px"><div style="flex:none;width:40px;height:40px;border-radius:20px;background:linear-gradient(160deg,#ea203a,#9c1222);color:#fff;display:grid;place-items:center;font:800 22px 'Barlow Condensed',sans-serif">${n}</div><div><div style="font:700 18px Barlow,sans-serif">${t}</div><div style="font-size:15px;color:#bdb5ba;line-height:1.4;margin-top:2px">${d}</div></div></div>`;
  const marco = body => `<div style="position:fixed;inset:0;z-index:50;background:radial-gradient(120% 40% at 50% 0%,rgba(215,31,48,.35),transparent 64%),#0e0c0f;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 24px)"><div style="max-width:520px;margin:0 auto;display:grid;gap:12px">
    <div style="display:flex;align-items:center;gap:12px"><img src="icon-192.png" alt="" width="54" height="54" style="border-radius:13px"><div style="font:800 36px/0.95 'Barlow Condensed',sans-serif;text-transform:uppercase">Instala <span style="color:#ea203a">Titanium</span></div></div>${body}
    <div style="font-size:14px;color:#a69ea3;text-align:center;margin-top:6px">¿Te enredaste? Escríbele al profe Franco</div></div></div>`;
  let html;
  if (esAndroid) {
    html = marco(`<p style="margin:0;color:#cfc8cc">Sigue estos pasos en tu Android 💪</p>
      ${enWA ? caja(1, 'Ábrela en Chrome', 'Toca los 3 puntitos <b>⋮</b> arriba a la derecha y elige <b>«Abrir en Chrome»</b> (o «Abrir en el navegador»).') : ''}
      <div id="and-inst" style="display:none">${caja(enWA ? 2 : 1, 'Toca «Instalar Titanium»', 'Y confirma con «Instalar».')}<button id="and-btn" style="margin-top:10px;width:100%;height:56px;border:0;border-radius:14px;background:#d71f30;color:#fff;font:800 20px Barlow,sans-serif">📲 Instalar Titanium</button></div>
      <div id="and-man">${caja(enWA ? 2 : 1, 'Toca los 3 puntitos ⋮', 'Arriba a la derecha de Chrome.')}${caja(enWA ? 3 : 2, '«Agregar a pantalla principal»', 'O «Instalar app». Luego toca <b>Instalar</b> / <b>Agregar</b>.')}</div>
      ${caja('✓', 'Abre Titanium desde tu pantalla', 'Busca el ícono nuevo entre tus apps, ábrelo y escribe tu código de 6 letras.')}`);
  } else if (iosOtro) {
    html = marco(`<p style="margin:0;color:#cfc8cc">Estás en Chrome (u otro navegador) en iPhone:</p>
      ${caja(1, 'Toca Compartir', 'El cuadrado con flecha ↑, arriba a la derecha junto a la dirección (o en el menú <b>⋯</b>).')}
      ${caja(2, '«Agregar a pantalla de inicio»', 'Baja en el menú si no lo ves, tócalo y luego toca <b>Agregar</b>.')}
      ${caja(3, 'Abre Titanium desde tu pantalla', 'Busca el ícono nuevo, ábrelo y escribe tu código de 6 letras.')}
      <div style="font-size:14px;color:#a69ea3">¿No aparece la opción? Abre el link en <b>Safari</b> y sigue la guía de iPhone.</div>`);
  } else {
    html = `<div style="position:fixed;inset:0;z-index:50;background:#0e0c0f;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)">
    <img src="guia-app-titanium.jpg?v=1794075963" alt="Cómo instalar Titanium: 1) Toca los 3 puntitos abajo a la derecha. 2) Toca Compartir. 3) Toca Ver más. 4) Toca Agregar a Inicio. 5) Toca Agregar. 6) Abre Titanium desde tu pantalla. 7) Escribe tu código y toca Entrar." style="display:block;width:100%;height:auto">
  </div>`;
  }
  document.getElementById('app').innerHTML = html;
  if (esAndroid) { // Chrome en Android ofrece instalar con un toque
    window.addEventListener('beforeinstallprompt', ev => { ev.preventDefault(); const box = document.getElementById('and-inst'); if (!box) return;
      box.style.display = 'block'; document.getElementById('and-man').style.display = 'none';
      document.getElementById('and-btn').onclick = async () => { ev.prompt(); try { await ev.userChoice; } catch (_) {} }; });
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  return; // solo se usa desde el ícono de la pantalla de inicio
}
await window.tlSession();
let { data: codigo, error: e1 } = await sb.rpc('vincular_alumno', { p_inv: invGuardada() });
const { data: cfgRow } = await sb.from('config').select('data').eq('id', 1).maybeSingle();
const waProfe = String(cfgRow?.data?.whatsapp || '').replace(/\D/g, ''); const profe = cfgRow?.data?.coach || 'tu profe';
while (!codigo) {
  const { data: u } = await sb.auth.getUser(); const inv = invGuardada(); const mail = u?.user?.email || '';
  const ayuda = waProfe ? `https://wa.me/${waProfe}?text=${encodeURIComponent(`Hola ${profe}! No puedo entrar a la app de Titanium 🙈\n${mail ? 'Mi correo: ' + mail : 'Entré sin correo'}${inv ? '\nCódigo que probé: ' + inv : ''}`)}` : '';
  $('#app').innerHTML = `<div class="center" style="justify-content:flex-start;padding-top:28px">
    <img src="icon-192.png" alt="" width="68" height="68" style="border-radius:16px">
    <h1>Tu código de invitación</h1>
    <p class="muted" style="margin:0">Escribe el código de 6 letras que te mandó ${esc(profe)} por WhatsApp.</p>
    ${inv ? `<div class="note small" style="max-width:340px;border:1px solid var(--warn)">El código <b>${esc(inv)}</b> no funcionó: puede estar mal escrito, ya se usó o venció (dura 24 horas). Pide uno nuevo.</div>` : ''}
    <input id="inv-in" autocapitalize="characters" autocomplete="off" maxlength="12" placeholder="Ej: K7M2QX" style="width:100%;max-width:340px;min-height:56px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);color:var(--fg);text-align:center;letter-spacing:.25em;font:700 22px Barlow,sans-serif;text-transform:uppercase">
    <button class="btn pri" id="inv-ok" style="width:100%;max-width:340px">Entrar</button>
    ${ayuda ? `<a class="btn" href="${ayuda}" target="_blank" rel="noopener" style="width:100%;max-width:340px;background:#1f7a4d;border-color:#1f7a4d;color:#fff">💬 Pedir ayuda a ${esc(profe)}</a>` : ''}
    <button class="btn" style="background:transparent;border:0;color:var(--muted)" onclick="tlLogout()">${mail ? `Usar otro correo (${esc(mail)})` : 'Volver al inicio'}</button></div>`;
  const v = await new Promise(res => { const go = () => { const x = $('#inv-in').value.trim().toUpperCase(); if (x) res(x); };
    $('#inv-ok').onclick = go; $('#inv-in').onkeydown = e => { if (e.key === 'Enter') go(); }; });
  $('#inv-ok').disabled = true; $('#inv-ok').textContent = 'Revisando…';
  try { localStorage.setItem('tl-inv', v); } catch (_) {}
  ({ data: codigo } = await sb.rpc('vincular_alumno', { p_inv: v }));
}
try { localStorage.removeItem('tl-inv'); } catch (_) {}

/* ---------- avisos push ---------- */
const PUSH_FN = 'https://lnovgbpxdnqgsojkfzwy.supabase.co/functions/v1/notificar';
const PUSH_H = { 'Content-Type': 'application/json', Authorization: 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxub3ZnYnB4ZG5xZ3Nvamtmend5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM4ODcwNjYsImV4cCI6MjEwOTQ2MzA2Nn0.7S4U0MtHCPRlhIYpaPE-AD5LEFKqZn0Kt82bKlYqNWE' }; // clave pública (anon)
const esIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const instalada = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const pushOK = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const b64u = x => { const r = atob((x + '='.repeat((4 - x.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(r, c => c.charCodeAt(0)); };
const pushEstado = () => S.push ? 'on' : (esIOS && !instalada()) ? 'instalar' : !pushOK() ? 'no' : Notification.permission === 'denied' ? 'bloqueado' : 'off';
const guardarSub = async s => !(await sb.rpc('guardar_mi_push', { p_sub: s.toJSON(), p_ua: navigator.userAgent })).error;
const swReg = () => navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready);
if ('serviceWorker' in navigator) swReg().then(r => r.pushManager && r.pushManager.getSubscription()).then(s => {
  const on = !!s && window.Notification && Notification.permission === 'granted'; if (s && on) guardarSub(s);
  if (on !== !!S.push) { S.push = on; if ((S.v === 'hoy' || S.v === 'plan') && !(document.activeElement && document.activeElement.matches('input,textarea'))) render(); } }).catch(() => {});
async function activarPush(btn) {
  if (!pushOK()) { toast('Este navegador no permite avisos.'); return; }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') { toast(perm === 'denied' ? 'Avisos bloqueados. Actívalos en Ajustes.' : 'No se activaron los avisos.'); render(); return; }
  if (btn) { btn.disabled = true; btn.textContent = 'Activando…'; }
  try {
    const reg = await swReg();
    const { pub } = await fetch(PUSH_FN, { method: 'POST', headers: PUSH_H, body: '{"init":true}' }).then(r => r.json());
    const s = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(pub) }));
    if (!(await guardarSub(s))) throw new Error('save');
    S.push = true; toast('Avisos activados 🔔'); render();
  } catch (e) { console.error(e); toast('No se pudieron activar los avisos. Intenta de nuevo.'); if (btn) { btn.disabled = false; btn.textContent = '🔔 Activar avisos'; } }
}
async function probarPush(btn) { btn.disabled = true; const s = await (await swReg()).pushManager.getSubscription();
  const r = s ? await fetch(PUSH_FN, { method: 'POST', headers: PUSH_H, body: JSON.stringify({ prueba: s.endpoint }) }).then(x => x.json()).catch(() => ({})) : {};
  btn.disabled = false; toast(r.ok ? 'Aviso de prueba enviado ✓' : 'No llegó la prueba. Desactiva y vuelve a activar.'); }
async function desactivarPush() { const s = await (await swReg()).pushManager.getSubscription();
  if (s) { await sb.rpc('borrar_mi_push', { p_endpoint: s.endpoint }); await s.unsubscribe().catch(() => {}); }
  S.push = false; toast('Avisos desactivados'); render(); }
function avisosCard() { const e = pushEstado(); const b = {
  on: `<div class="small ok" style="font-weight:700">Activados en este teléfono ✓</div><div class="small muted">Te avisamos cuando Franco te agenda algo y el día anterior.</div><div class="grid2"><button class="btn" data-pushtest="1">Enviar prueba</button><button class="btn" data-pushoff="1">Desactivar</button></div>`,
  off: `<div class="small muted">Recibe un aviso cuando Franco te agende una evaluación, reunión, pauta o documento, y un recordatorio el día anterior.</div><button class="btn pri" data-push="1">🔔 Activar avisos</button>`,
  instalar: `<div class="small muted">En iPhone los avisos funcionan con la app en tu pantalla de inicio:</div><ol class="small" style="margin:0;padding-left:20px;line-height:1.7"><li>Abre este link en <b>Safari</b>.</li><li>Toca <b>Compartir</b> (cuadrado con flecha ↑).</li><li>Elige <b>«Agregar a inicio»</b>.</li><li>Entra a Titanium desde el ícono nuevo y activa los avisos aquí.</li></ol>`,
  bloqueado: `<div class="small warn">Los avisos están bloqueados. Ve a <b>Ajustes → Notificaciones → Titanium</b> y permítelos.</div>`,
  no: `<div class="small muted">Este navegador no permite avisos. Usa Safari en iPhone o Chrome en Android.</div>` }[e];
  return `<details class="card blk" id="push-card" data-sec="avisos" ${secAbiertos.has('avisos') ? 'open' : ''}><summary><div><h2>🔔 Avisos</h2><div class="small ${e === 'on' ? 'ok' : 'muted'}">${e === 'on' ? 'Activados ✓' : 'Desactivados'}</div></div><span class="chev" aria-hidden="true">›</span></summary>${b}</details>`; }
function avisoBanner() { const e = pushEstado(); let x = null; try { x = localStorage.getItem('tl-pushx'); } catch (_) {}
  if (x || !['off', 'instalar'].includes(e)) return '';
  return `<section class="card" style="border-color:var(--ev);background:rgba(77,163,255,.08)"><div class="row"><b>🔔 Activa los avisos</b><button data-pushx="1" aria-label="Ocultar" style="background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;min-width:36px;min-height:36px">✕</button></div><div class="small muted">Entérate al tiro cuando Franco te agende algo.</div>${e === 'off' ? '<button class="btn pri" data-push="1">Activar avisos</button>' : '<button class="btn" data-go="plan">Ver cómo activarlos</button>'}</section>`; }

async function load() {
  const desde = addDays(today(), -120);
  const [a, p, c, cf, ev, cfm, ah, tq, msj] = await Promise.all([
    sb.from('alumnos').select('*').eq('codigo', codigo).single(),
    sb.from('planes').select('*').eq('alumno', codigo),
    sb.from('clases').select('*').eq('alumno', codigo).gte('fecha', desde).order('fecha'),
    sb.from('config').select('data').eq('id', 1).maybeSingle(),
    sb.from('eventos').select('*').gte('fecha', desde).order('fecha'),
    sb.from('confirmaciones').select('fecha,hora,estado,cambios').eq('alumno', codigo).gte('fecha', today()),
    sb.from('actividades_hechas').select('evento,fecha,minutos,rpe,nota').eq('alumno', codigo).gte('fecha', desde),
    sb.from('tecnica').select('id,nombre,patron,claves,video,orden').order('orden'),
    sb.from('mensajes').select('id,titulo,cuerpo,enviado_at').not('enviado_at', 'is', null).gte('enviado_at', new Date(Date.now() - 7 * 864e5).toISOString()).order('enviado_at', { ascending: false }).limit(5),
  ]);
  S.mensajes = msj?.data || []; S.hechas = new Map((ah?.data || []).map(r => [String(r.evento), r]));
