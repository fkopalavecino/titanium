<script>
(async () => {
const sb = window.__sb;
const $ = s => document.querySelector(s);
const esc = x => String(x == null ? '' : x).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const toISO = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => toISO(new Date());
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return toISO(d); };
const diffDays = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 864e5);
const DK = ['dom','lun','mar','mie','jue','vie','sab'];
const DL = {dom:'Dom',lun:'Lun',mar:'Mar',mie:'Mié',jue:'Jue',vie:'Vie',sab:'Sáb'};
const MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const dayKey = s => DK[parseISO(s).getDay()];
const fmtD = s => s ? parseISO(s).getDate() + ' ' + MES[parseISO(s).getMonth()].slice(0, 3) : '—';
const longD = s => { const d = parseISO(s); return ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'][d.getDay()] + ' ' + d.getDate() + ' de ' + MES[d.getMonth()]; };
const clp = n => '$' + Math.round(Number(n) || 0).toLocaleString('es-CL');
const hm = s => { const [h, m] = String(s).split(':').map(Number); return h * 60 + (m || 0); };
const nowM = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const toast = m => { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2800); };
const S = { v: 'hoy', wk: null, dia: null, a: null, planes: [], clases: [], rutinas: new Map(), cfg: {}, sel: null, eventos: [], fotos: [], medidas: [], inbody: [], urls: {}, fang: 'frente' };

/* invitación de Franco: el link trae ?i=CÓDIGO; se guarda para usarlo después de entrar con el correo */

  const rp = ev.target.closest('[data-rpe]'); if (rp) { S.rpe = Number(rp.dataset.rpe); { const d = getDraft(); d.rpe = S.rpe; putDraft(d); } document.querySelectorAll('[data-rpe]').forEach(b => b.setAttribute('aria-pressed', b === rp)); return; }
  const vy = ev.target.closest('[data-voy]'); if (vy) { vy.disabled = true; if (!(await confirmar(vy.dataset.voy, 'voy'))) vy.disabled = false; return; }
  const nvy = ev.target.closest('[data-nov]'); if (nvy) { confirmar(nvy.dataset.nov, 'no_voy'); return; }
  const nv = ev.target.closest('[data-novoy]'); if (nv) { const x = proximas(4)[Number(nv.dataset.novoy)]; if (x && await solicitar('no_voy', { fecha: x.f, hora: x.h })) { nv.disabled = true; nv.style.opacity = '.6'; } return; }
  if (ev.target.id === 'recuperar') { const v = $('#pref').value.trim(); if (!v) { toast('Escribe qué día te acomoda.'); return; } if (await solicitar('recuperar', { prefiere: v })) $('#pref').value = ''; return; }
  if (ev.target.id === 'avisarPago') { const v = $('#pmonto').value.trim(); if (await solicitar('pago', { monto: v ? clp(v.replace(/\D/g, '')) : 'sin monto' })) $('#pmonto').value = ''; return; }
  if (ev.target.id === 'guardar') {
    const rd = rutinaDeHoy(); const by = {};
    document.querySelectorAll('.set input').forEach(i => { const v = i.value.trim().replace(',', '.'); const o = (by[i.dataset.n] = by[i.dataset.n] || []); o[i.dataset.i] = o[i.dataset.i] || {}; if (v !== '' && !isNaN(v)) o[i.dataset.i][i.dataset.f] = Number(v); });
    const ej = Object.entries(by).map(([n, sets]) => { const ss = sets.map(s => s || {}).filter(s => s.kg != null || s.r != null); if (!ss.length) return null;
      const top = ss.reduce((b, s) => (s.kg || 0) > (b.kg || 0) ? s : b, ss[0]); return { n, kg: top.kg, r: top.r, s: ss.length, sets: ss }; }).filter(Boolean);
    const btn = ev.target; btn.disabled = true;
    const rpe = S.rpe ?? rd.rec?.rpe ?? null;
    const { error } = await sb.rpc('registrar_mi_sesion', { p_fecha: today(), p_hora: rd.hora, p_ej: ej, p_carga: $('#carga').value.trim() || null, p_rpe: rpe });
    btn.disabled = false;
    if (error) { toast('No se pudo guardar: ' + error.message); return; }
    clearDraft(); await load(); toast('Entrenamiento guardado 💪'); render();
  }
});
render();
/* abrir el evento de un aviso: Evaluación → Progreso (evaluaciones); el resto → Agenda en ese día */
async function irAEvento(id) {
  let e = S.eventos.find(x => String(x.id) === String(id));
  if (!e) { await load(); e = S.eventos.find(x => String(x.id) === String(id)); } if (!e) return;
  document.getElementById('sheet')?.remove();
  if (e.tipo === 'Evaluación' && /foto/i.test(e.titulo || '')) { S.v = 'progreso'; S.evalFirst = false; S.fotoUp = true; S.ptab = 'fotos'; }
  else if (e.tipo === 'Evaluación') { S.v = 'progreso'; S.evalFirst = true; S.ptab = 'cuerpo'; } else { S.v = 'agenda'; S.dia = e.fecha; S.wk = lunesDe(e.fecha); }
  render();
  abrirEvento(e.id);
}
async function avisoPendiente() { if (!('caches' in window)) return null;
  try { const c = await caches.open('tl-push'); const r = await c.match('pending'); if (!r) return null; await c.delete('pending'); const p = await r.json(); return Date.now() - p.t < 15 * 60e3 ? p.ev : null; } catch (_) { return null; } }
async function irAClase(k, r) { if (!/^\d{4}-\d\d-\d\d_\d\d:\d\d$/.test(k || '')) return; const [f] = k.split('_');
  document.getElementById('sheet')?.remove(); S.v = 'agenda'; S.dia = f; S.wk = lunesDe(f); render();
  if (r === 'voy') await confirmar(k, 'voy'); else if (r === 'no') await confirmar(k, 'no_voy'); }
const revisarAviso = async () => { const id = await avisoPendiente(); if (!id) return; if (String(id).startsWith('clase|')) { const [, k, r] = String(id).split('|'); irAClase(k, r); } else irAEvento(id); };
const qs0 = new URLSearchParams(location.search); const evq = qs0.get('ev'), clq = qs0.get('clase'); if (qs0.get('msg')) { history.replaceState(null, '', location.pathname); S.v = 'hoy'; }
if (evq) { history.replaceState(null, '', location.pathname); avisoPendiente(); irAEvento(evq); }
else if (clq) { history.replaceState(null, '', location.pathname); avisoPendiente(); irAClase(clq, qs0.get('r')); }
else revisarAviso();
let ocultaDesde = 0;
document.addEventListener('visibilitychange', () => { if (document.visibilityState !== 'visible') { ocultaDesde = Date.now(); return; } revisarAviso();
  const quieto = !(document.activeElement && document.activeElement.matches('input,textarea'));
  if (ocultaDesde && Date.now() - ocultaDesde > 120000) { nuevaFrase(); if (S.v === 'hoy' && quieto && !(diaRender && today() !== diaRender)) render(); }
  if (diaRender && today() !== diaRender && quieto) load().then(render).catch(() => render()); });
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', m => { if (m.data && m.data.ev) revisarAviso(); });
const rel = async () => { await load(); if (!document.activeElement || !document.activeElement.matches('input')) render(); };
sb.channel('al-' + codigo).on('postgres_changes', { event: '*', schema: 'public', table: 'clases', filter: 'alumno=eq.' + codigo }, rel).on('postgres_changes', { event: '*', schema: 'public', table: 'eventos' }, rel).on('postgres_changes', { event: '*', schema: 'public', table: 'mensajes' }, rel).subscribe();
})();
