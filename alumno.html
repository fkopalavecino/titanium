// sincronía: los cambios que hace Franco (asistencia, rutina, pagos, horario, actividades) llegan solos.
// No reacciona al eco de lo que este teléfono acaba de guardar, y mientras entrena actualiza los datos sin redibujar.
let RF = null, RFcorriendo = false;
async function refrescar() { if (RFcorriendo) { clearTimeout(RF); RF = setTimeout(refrescar, 1500); return; } RFcorriendo = true;
  try { await load(); } catch (_) { RFcorriendo = false; return; } RFcorriendo = false;
  if (diaRender && today() !== diaRender) { if (S.ses?.auto) S.ses = null; S.foco = null; render(); return; }
  const entrenando = S.v === 'rutina' && document.querySelector('.ej,#guardar') && !appBloqueada();

  if (!entrenando && !escribiendo) render(true); }
const rel = p => { const t = p && p.table;
  if (t === 'clases') { const n = p.new || {}, o = p.old || {};
    const soloMio = p.eventType === 'UPDATE' && Object.keys(o).length > 3 && Object.keys(n).every(k => ['ej', 'carga', 'rpe', 'updated_at'].includes(k) || JSON.stringify(n[k]) === JSON.stringify(o[k]));
    const primeroMio = p.eventType === 'INSERT' && S.miEscritura && Date.now() - S.miEscritura < 6000 && n.asis == null && !n.extra;
    if (soloMio || primeroMio) return; } // eco de lo que anota el alumno
  if (t === 'alumnos' && S.usoAt && Date.now() - S.usoAt < 6000) return; // eco de "última vez que usó la app"
  clearTimeout(RF); RF = setTimeout(refrescar, 800); };
sb.channel('al-' + codigo)
  .on('postgres_changes', { event: '*', schema: 'public', table: 'clases', filter: 'alumno=eq.' + codigo }, rel)
  .on('postgres_changes', { event: '*', schema: 'public', table: 'planes', filter: 'alumno=eq.' + codigo }, rel)
  .on('postgres_changes', { event: '*', schema: 'public', table: 'alumnos', filter: 'codigo=eq.' + codigo }, rel)
  .on('postgres_changes', { event: '*', schema: 'public', table: 'eventos' }, rel)
  .on('postgres_changes', { event: '*', schema: 'public', table: 'mensajes' }, rel)
  .on('postgres_changes', { event: '*', schema: 'public', table: 'config' }, rel)
  .subscribe();
})();
</script>
<script>
/* Fija la barra de abajo: iOS a veces deja el viewport descuadrado (tras teclado, scroll o volver a la app) y la barra "flota".
   Se mide dónde quedó realmente y se corrige; nunca se calcula a ciegas. */
(() => {
  const vv = window.visualViewport, nav = document.getElementById('tabs');
  if (!nav) return;
  nav.style.bottom = '0px';
  const esInput = el => el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable);
  let raf = 0, intento = 0;
  const fondo = () => vv ? vv.offsetTop + vv.height : window.innerHeight;
  const ajustar = () => {
    raf = 0;
    if (esInput(document.activeElement)) { nav.style.visibility = 'hidden'; return; }
    nav.style.visibility = '';
    if (nav.hidden) return;
    nav.style.transform = '';
    const dif = Math.round(fondo() - nav.getBoundingClientRect().bottom);
    if (Math.abs(dif) <= 2) { intento = 0; return; }
    if (intento === 0) { intento = 1; const y = window.scrollY; window.scrollTo(window.scrollX, y + 1); window.scrollTo(window.scrollX, y); pedir(); return; }
    intento = 0; nav.style.transform = 'translateY(' + dif + 'px)';
  };
  const pedir = () => { if (!raf) raf = requestAnimationFrame(ajustar); };
  if (vv) { vv.addEventListener('resize', pedir); vv.addEventListener('scroll', pedir); }
  window.addEventListener('scroll', pedir, { passive: true }); window.addEventListener('resize', pedir);
  window.addEventListener('pageshow', pedir); window.addEventListener('orientationchange', () => setTimeout(pedir, 300));
  document.addEventListener('focusin', pedir);
  document.addEventListener('focusout', () => [60, 300, 700].forEach(t => setTimeout(pedir, t)));
  document.addEventListener('visibilitychange', () => [0, 300].forEach(t => setTimeout(pedir, t)));
  document.addEventListener('touchend', pedir, { passive: true });
  setInterval(() => { if (!document.hidden) pedir(); }, 1500);
  pedir();
})();
</script>
