<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><style id="tl-hide">body>*:not(#tl-gate){visibility:hidden!important}html,body{background:#0e0c0f!important}</style></head><body>
<title>Titanium Sport Control</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0e0c0f"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: black brand band + sticky tab rail; working views below, cards only where a block is its own object. */
:root{
  --bg:#f5f3f3; --surface:#ffffff; --sunk:#efecec; --line:#e4dfdf; --fg:#18151a; --muted:#6c656a;
  --ink:#0e0c0f; --ink-fg:#f4f1f2; --ink-muted:#a79fa4;
  --red:#d71f30; --red-soft:#fbe9eb; --red-fg:#ffffff;
  --ok:#17804a; --ok-soft:#e5f4ec; --warn:#a45f00; --warn-soft:#fdf1df; --crit:#b4142b; --crit-soft:#fbe6e9; --info:#2d5d9f; --info-soft:#e7eef8;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(20,10,12,.06),0 6px 18px rgba(20,10,12,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121013; --surface:#1b181c; --sunk:#161317; --line:#2f2a2e; --fg:#f2eef0; --muted:#a69ea3;
  --ink:#08070a; --ink-fg:#f4f1f2; --ink-muted:#9c949a;
  --red:#ff4a5b; --red-soft:#3a1a1f; --red-fg:#1a0b0d;
  --ok:#4fcf8c; --ok-soft:#163223; --warn:#f2b44f; --warn-soft:#3a2b14; --crit:#ff6b7c; --crit-soft:#3d1820; --info:#86b2ff; --info-soft:#1a2740;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121013; --surface:#1b181c; --sunk:#161317; --line:#2f2a2e; --fg:#f2eef0; --muted:#a69ea3;
  --ink:#08070a; --ink-fg:#f4f1f2; --ink-muted:#9c949a;
  --red:#ff4a5b; --red-soft:#3a1a1f; --red-fg:#1a0b0d;
  --ok:#4fcf8c; --ok-soft:#163223; --warn:#f2b44f; --warn-soft:#3a2b14; --crit:#ff6b7c; --crit-soft:#3d1820; --info:#86b2ff; --info-soft:#1a2740;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* brand band */
.band{background:var(--ink);color:var(--ink-fg);border-bottom:3px solid var(--red)}
.band .wrap{display:flex;align-items:center;gap:16px;padding-block:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.logo .mark{width:38px;height:38px;border:2px solid var(--red);border-radius:6px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:19px;color:var(--red);letter-spacing:-.02em}
.logo b{display:block;font-family:var(--display);font-size:22px;letter-spacing:.08em;line-height:1}
.logo small{display:block;font-size:10px;letter-spacing:.42em;color:var(--red);font-weight:700;margin-top:2px}
.band .lema{font-family:var(--display);font-size:17px;color:var(--ink-muted);letter-spacing:.04em;text-transform:uppercase}
.band .grow{flex:1}
.band .meta{font-size:13px;color:var(--ink-muted)}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tabs a{flex:none;padding:13px 12px 11px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--red)}
.tabs a:hover{color:var(--fg)}

main.wrap{padding-block:22px 80px;display:grid;gap:22px}
.vhead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;justify-content:space-between}
.vhead h1{font-size:30px;line-height:1.05}
.vhead p{margin:4px 0 0;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--red);border-color:var(--red);color:var(--red-fg)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding-inline:8px}
.btn.ghost:hover{color:var(--fg)}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:7px}
.btn.on-ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.on-crit{background:var(--crit);border-color:var(--crit);color:var(--surface)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.band .btn{background:transparent;color:var(--ink-fg);border-color:#3a3439}
.band .btn.pri{background:var(--red);border-color:var(--red);color:#fff}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=month],input[type=tel],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;font-size:15px}
textarea{width:100%;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--red);outline:none}
.search{width:220px;max-width:100%}
label.f{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
label.f input,label.f select,label.f textarea{color:var(--fg);font-weight:400}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.muted{color:var(--muted)}
.small{font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.grid2>*{min-width:0}

/* hero */
.hero{background:var(--ink);color:var(--ink-fg);border-radius:var(--r);padding:24px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border:28px solid var(--red);border-radius:50%;opacity:.16}
.hero h1{font-size:34px;line-height:1}
.hero h1 span{color:var(--red)}
.hero p{margin:6px 0 0;color:var(--ink-muted)}
.hero .grow{flex:1;min-width:220px;position:relative;z-index:1}
.hero .tools{position:relative;z-index:1}
.hero .btn{background:transparent;color:var(--ink-fg);border-color:#3d363b}
.hero .btn.pri{background:var(--red);color:#fff;border-color:var(--red)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{padding:14px 16px}
.kpi .l{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.kpi .v{font-family:var(--display);font-size:32px;font-weight:700;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.alert .v{color:var(--crit)}

/* lists */
.list{display:grid}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600}
.count{min-width:30px;text-align:center;border-radius:7px;padding:2px 7px;font-weight:700;font-size:13px;background:var(--warn-soft);color:var(--warn);font-variant-numeric:tabular-nums}
.count.zero{background:var(--sunk);color:var(--muted)}
.count.crit{background:var(--crit-soft);color:var(--crit)}

.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.muted{background:var(--sunk);color:var(--muted)}
button.pill.go{border:0;cursor:pointer;font-family:inherit}
button.pill.go:hover{filter:brightness(.92);text-decoration:underline}
tr.foco td{background:var(--crit-soft)}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .c{opacity:.6;font-weight:500;margin-left:4px}

/* next block */
.big-time{font-family:var(--display);font-size:64px;font-weight:700;line-height:.95;letter-spacing:-.01em}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
tr:first-child td{border-top:0}
td.r,th.r{text-align:right}
td .sub{display:block;font-size:12px;color:var(--muted)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}

/* horario grid */
.hgrid{min-width:820px}
.hgrid td{vertical-align:top;padding:8px;border-left:1px solid var(--line);width:19%}
.hgrid td.h{width:64px;font-family:var(--display);font-size:20px;font-weight:700;border-left:0;background:var(--sunk)}
.hgrid .cnt{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.hgrid .cnt.full{color:var(--crit)}
.slot-name{display:flex;align-items:center;justify-content:space-between;gap:4px;font-size:13px;padding:3px 6px;border-radius:6px}
.slot-name:hover{background:var(--sunk)}
.slot-name.hl{background:var(--red-soft);color:var(--red);font-weight:700}
.slot-name button{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 4px;font-size:15px;line-height:1}
.slot-name button:hover{color:var(--crit)}
.add{border:0;background:none;color:var(--red);font-weight:600;font-size:13px;cursor:pointer;padding:3px 6px}
.na{color:var(--muted);font-size:12px;font-style:italic}
.dayseg{display:none}
@media (max-width:760px){
  .dayseg{display:flex}
  .hgrid{min-width:0}
  .hgrid[data-show] th.dc,.hgrid[data-show] td.dc{display:none}
  .hgrid[data-show="lun"] .d-lun,.hgrid[data-show="mar"] .d-mar,.hgrid[data-show="mie"] .d-mie,.hgrid[data-show="jue"] .d-jue,.hgrid[data-show="vie"] .d-vie,.hgrid[data-show="sab"] .d-sab{display:table-cell!important;width:auto}
}

/* clase de hoy */
.student{padding:14px 16px;display:grid;gap:10px}
.student.present{border-color:var(--ok)}
.student.absent{opacity:.7}
.student.reag{border-left:4px solid var(--info)}
.st-top{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.st-top .grow{flex:1;min-width:160px}
.st-name{font-weight:700;font-size:17px}
.st-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.st-row select{flex:1 1 240px;min-width:0;max-width:100%}
.student label.f input,.student label.f textarea{width:100%}
.student .frow{grid-template-columns:minmax(0,1fr) 84px}
.cargas{display:grid;gap:6px;background:var(--sunk);border-radius:8px;padding:10px 12px}
.ej-row{display:grid;grid-template-columns:minmax(0,1fr) 76px 64px 34px;gap:6px;align-items:center}
.ej-row.h{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ej-row.h span{text-align:center}
.ej-row input{width:100%;padding:8px 6px;text-align:center;font-variant-numeric:tabular-nums}
.ej-n{font-size:14px;font-weight:600;line-height:1.25;min-width:0}
.ej-n .d{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.ej-n .d b{color:var(--fg);font-weight:600}
.ej-row .btn{justify-content:center;padding:6px 0}
.ej-blk{display:grid;gap:4px;padding:10px 0 4px;border-top:1px solid var(--line)}
.ej-blk:first-child{border-top:0;padding-top:0}
.ser-row{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 38px;gap:6px;align-items:center}
.ser-row.h{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ser-row.h span{text-align:center}
.ser-row input{width:100%;padding:9px 6px;text-align:center;font-variant-numeric:tabular-nums}
.ser-row .sn{text-align:center;font-weight:700;color:var(--muted)}
.ser-row .btn{justify-content:center;padding:7px 0}
.ses-blq{display:grid;gap:6px;background:var(--sunk);border-radius:8px;padding:10px 12px}
.ses-blq h4{margin:0;font-size:14px}
.ses-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 34px 34px;gap:6px;align-items:center}
.ses-row input{width:100%;padding:8px}
.ses-row .btn{justify-content:center;padding:6px 0}
@media (max-width:560px){.ses-row{grid-template-columns:minmax(0,1fr) 34px 34px}.ses-row .ses-d{grid-column:1/2}}
.car-hist{display:grid;gap:0}
.sheet.wide{width:min(980px,100%)}
.pg-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.pg-kpis .kpi{background:var(--sunk);border-radius:10px;box-shadow:none;border:0}
.pg-kpis .kpi .v{font-size:28px}
.up{color:var(--ok);font-weight:700}.down{color:var(--crit);font-weight:700}
.badges{display:flex;gap:8px;flex-wrap:wrap}
details.fotos>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;gap:8px;align-items:center}
details.fotos>summary::-webkit-details-marker{display:none}
.f-slots{display:grid;grid-template-columns:repeat(3,minmax(0,140px));gap:8px}
.f-slot{position:relative;aspect-ratio:3/4;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;text-align:center;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;overflow:hidden;background:var(--sunk)}
.f-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.f-slot input{position:absolute;inset:0;opacity:0;cursor:pointer}
.f-slot .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:3px}
.f-slot.busy::after{content:'Subiendo…';position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff}
.f-del{position:absolute;top:4px;right:4px;z-index:2;border:0;border-radius:999px;width:26px;height:26px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer}
.f-cmp{display:grid;grid-template-columns:repeat(2,minmax(0,240px));gap:10px;justify-content:center}
.f-cmp figure{margin:0;display:grid;gap:4px}
.f-cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--sunk);cursor:zoom-in}
.f-cmp figcaption{font-size:12px;font-weight:700;text-align:center}
.f-hist{display:grid;gap:8px}
.f-hist .row{display:grid;grid-template-columns:90px repeat(3,minmax(0,80px));gap:6px;align-items:center}
.f-hist img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;cursor:zoom-in}
.f-hist .vac{aspect-ratio:3/4;border-radius:8px;background:var(--sunk)}
#lightbox{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.9);display:grid;place-items:center;cursor:zoom-out;padding:16px}
#lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.badge{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:var(--surface);font-size:13px;font-weight:600}
.badge .ic{font-size:20px;line-height:1}
.badge small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.badge.off{opacity:.45;filter:grayscale(1)}
.pr{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:11px;font-weight:800;vertical-align:1px}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:14px;font-weight:500;color:var(--fg)}
.ck input{width:18px;height:18px;margin-top:1px;accent-color:var(--red);flex:none}
.ckgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:6px 14px}
details.sec{background:var(--sunk);border-radius:var(--r);padding:12px 16px}
details.sec summary{cursor:pointer;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details.sec[open] summary{margin-bottom:10px}
.seg-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.seg-row:first-child{border-top:0}
.seg-row .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--sunk);font-size:16px;flex:none}
.rut{background:var(--sunk);border-radius:8px;padding:12px;display:grid;gap:10px}
.rut h4{margin:0;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.rut ol{margin:0;padding-left:20px;display:grid;gap:3px}
.rut .d{color:var(--muted);font-size:13px}
.students{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,430px),1fr));gap:14px;align-items:start}
.students>*{min-width:0}

/* timer */
.timer{background:var(--ink);color:var(--ink-fg);border-radius:var(--r);padding:18px;display:grid;gap:12px}
.timer .clock{font-family:var(--display);font-size:clamp(64px,16vw,120px);font-weight:700;line-height:.9;font-variant-numeric:tabular-nums}
.timer .phase{font-family:var(--display);font-size:22px;letter-spacing:.08em;text-transform:uppercase}
.timer .phase.work{color:var(--red)}
.timer .phase.rest{color:var(--ink-muted)}
.timer input{width:80px;background:#1d1a1e;border-color:#3a3439;color:var(--ink-fg)}
.timer label.f{color:var(--ink-muted)}
.timer .btn{background:transparent;color:var(--ink-fg);border-color:#3d363b}
.timer .btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.bar{height:6px;background:#2a2529;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red)}

/* workouts */
.wk{padding:0}
.wk summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:10px;align-items:center}
.wk summary::-webkit-details-marker{display:none}
.wk summary .grow{flex:1;min-width:0}
.wk[open] summary{border-bottom:1px solid var(--line)}
.wk .body{padding:14px 16px;display:grid;gap:12px}
.star{border:0;background:none;cursor:pointer;font-size:18px;color:var(--muted);padding:0 4px}
.star.on{color:var(--red)}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,6,8,.5);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:14px;width:min(620px,100%);max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sheet header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--surface);z-index:1}
.sheet header h2{font-size:24px;flex:1}
.sheet .content{padding:18px;display:grid;gap:14px}
.sheet footer{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface)}
.blk-grid{overflow-x:auto}
.blk-grid table{font-size:13px}
.blk-grid td,.blk-grid th{padding:5px 6px;text-align:center}
.blk-grid td:first-child{text-align:left;font-weight:700;font-family:var(--display);font-size:16px}
.blk-grid input{width:18px;height:18px;accent-color:var(--red)}
.confirm{background:var(--crit-soft);color:var(--crit);border-radius:8px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.toast.err{background:var(--crit);color:#fff}
.empty{padding:28px;text-align:center;color:var(--muted)}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:12px 16px;font-weight:600}
.quote{font-family:var(--display);font-size:24px;line-height:1.15;font-weight:600}
.spark{display:block;width:100%;height:auto}
@media (max-width:560px){
  .vhead h1{font-size:26px}
  .big-time{font-size:52px}
  .band .lema{display:none}
  .search{width:100%}
  .students{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  {f:'Los pensamientos son cosas, y muy poderosas cuando se unen a un propósito definido.', t:'Hill abre el libro con esta idea: todo logro existe primero como un pensamiento claro, sostenido con decisión hasta convertirse en acción.', r:'Titanium nació de algo muy tuyo: las placas de titanio que llevas en la pierna y la clavícula. Convertiste una lesión en el nombre de tu gym. Eso es un pensamiento convertido en cosa.'},
  {f:'El deseo es el punto de partida de todo logro.', t:'No habla de un anhelo vago, sino de un deseo ardiente y definido, con una meta concreta, una fecha y un plan para alcanzarla.', r:'Ya tienes deseos definidos: 83 kg para Navidad, una media maratón en 1:40 y llenar los bloques de Titanium. Escríbelos con fecha y míralos cada mañana.'},
  {f:'Hay una diferencia entre desear algo y estar preparado para recibirlo.', t:'Para Hill, estar preparado es creer que lo vas a lograr y construir las condiciones para recibirlo cuando llegue.', r:'Ordenar tu control, los pagos y las rutinas es prepararte para recibir más alumnos y proyectos como la asesoría online, sin que todo dependa de tu memoria.'},
  {f:'Un desertor nunca gana, y un ganador nunca deserta.', t:'Hill insiste en que casi todos abandonan justo cuando la derrota temporal aparece. Quien sigue, gana precisamente porque no se detiene.', r:'Es tu lema con otras palabras: el que abandona pierde. Lo viviste después de la fractura de tibia y peroné: volviste, y hoy haces fuerza, MTB, trail y ruta.'},
  {f:'La persistencia es al carácter de una persona lo que el carbono es al acero.', t:'La persistencia es lo que endurece el carácter. Hill dice que se entrena como un hábito, partiendo de un propósito claro y un plan definido.', r:'Llevas titanio en el cuerpo y en el nombre. Tu método lo aplica: repetir una variante 4 a 6 semanas y progresar de a una variable. Así se forja el carácter, el tuyo y el de tus alumnos.'},
  {f:'Se detuvo a un metro del oro.', t:'Hill cuenta la historia de un minero que abandonó su mina y vendió la maquinaria. Quien se la compró encontró la veta un metro más allá.', r:'Comeback FKO es justamente no detenerse a un metro: volver pronto después de cada caída. Vale también para el alumno que quiere dejar en la semana 3, justo antes de ver resultados.'},
  {f:'Toda adversidad trae consigo la semilla de un beneficio equivalente o mayor.', t:'Ninguna derrota es en vano si la miras buscando la lección. El fracaso temporal trae información que no tendrías de otra forma.', r:'El accidente en moto te dejó placas de titanio y de ahí salió el nombre de tu gym. Tu adversidad más dura se convirtió en tu marca.'},
  {f:'Las ideas son el punto de partida de todas las fortunas.', t:'Hill dedica un capítulo a la imaginación: el taller donde los deseos se convierten en planes concretos.', r:'Tienes varias en marcha: el asistente de nutrición, la asesoría online, Comeback FKO con tu apellido y salir al cerro con alumnos. Elige una, conviértela en plan y avanza.'},
  {f:'El conocimiento es solo poder en potencia.', t:'Saber mucho no basta. El conocimiento se vuelve poder cuando se organiza en planes y se usa con un fin definido.', r:'Como profesor de Educación Física dominas RIR, RPE, progresiones y los bloques FKO. Se vuelve poder cuando lo transformas en sistema: plantillas, pautas y esta app trabajando por ti.'},
  {f:'La fe es el químico principal de la mente.', t:'Para Hill la fe se puede cultivar, y es la que convierte un deseo en acción constante.', r:'Quieres que entrar a Titanium dé felicidad y orgullo. Cuando crees en el progreso de cada alumno, sobre todo el que llega con poca experiencia, él empieza a creerlo también.'},
  {f:'Dos mentes que trabajan en armonía crean una tercera fuerza invisible.', t:'Es el principio del Master Mind: rodearte de personas alineadas con tu propósito multiplica lo que puedes lograr solo.', r:'Titanium crece más con equipo: alianzas como nutrición, alumnos que traen a otros, las salidas al cerro y herramientas que te liberen tiempo para entrenar y dirigir.'},
  {f:'Somos lo que somos por los pensamientos dominantes que dejamos ocupar nuestra mente.', t:'Hill explica la autosugestión: lo que te repites a diario termina guiando lo que haces.', r:'Lo dijiste tú: «soy el activo más importante». Si eso es lo que te repites cada mañana, tu sueño, tu comida y tu entrenamiento empiezan a alinearse con esa frase.'},
  {f:'La oportunidad suele entrar por la puerta de atrás, disfrazada de desgracia o derrota temporal.', t:'Muchas oportunidades no se reconocen porque llegan con forma de problema.', r:'La lesión te frenó, pero te dio el nombre de tu gym y la historia de Comeback FKO. Lo mismo pasa con los bloques vacíos: parecen un problema y son espacio para crecer.'},
  {f:'Quienes triunfan deciden rápido y cambian de opinión lentamente.', t:'Hill encontró que las personas exitosas toman decisiones con prontitud y las sostienen. La indecisión es un enemigo silencioso.', r:'Es tu método aplicado a la vida: cambia una sola variable a la vez. Elige una mejora para Titanium, sostenla unas semanas y evalúa antes de cambiar de rumbo.'},

    </div>`; }).join('')}
    <div class="small muted">Anota la serie más pesada (top set). Con <b>=</b> copias lo de la última vez.</div>

}
function setEj(k, n, patch) {
  const [f, h, code] = k.split('|');
  const ej = clone(rec(f, h, code).ej || []);
  let x = ej.find(o => o.n === n); if (!x) { x = {n}; ej.push(x); }
  for (const fld in patch) { if (patch[fld] == null || patch[fld] === '' || isNaN(patch[fld])) delete x[fld]; else x[fld] = Number(patch[fld]); }
  const ej2 = ej.filter(o => o.kg != null || o.r != null);
  patchDia(f, h, code, {ej: ej2.length ? ej2 : null});
}
function rutinaBody(r) {

/* timer */
const T = {intervalo: 60, activo: 25, rondas: 8, running: false, start: 0, acc: 0, lastPhase: null, lock: null};
function timerHTML() {
  return `<section class="timer" aria-label="Temporizador">
    <div class="tools" style="justify-content:space-between">
      <span class="phase" id="t-phase">Listo</span><span class="num" id="t-round" style="font-family:var(--display);font-size:22px"></span>
    </div>
    <div class="clock" id="t-clock">0:00</div>
    <div class="bar"><i id="t-bar" style="width:0%"></i></div>
    <div class="tools" style="justify-content:space-between">
      <div class="tools">
        <label class="f">Cada (s)<input type="number" id="t-int" min="10" value="${T.intervalo}"></label>
        <label class="f">Trabajo (s)<input type="number" id="t-act" min="5" value="${T.activo}"></label>
        <label class="f">Rondas<input type="number" id="t-ron" min="1" value="${T.rondas}"></label>
      </div>
      <div class="tools">
        <button class="btn pri" data-act="t-start" id="t-start">${T.running ? 'Pausar' : 'Iniciar'}</button>
        <button class="btn" data-act="t-reset">Reiniciar</button>
      </div>
    </div>
    <div class="small" style="color:var(--ink-muted)">EMOM: cada ${T.intervalo} s empieza una estación; trabajo máximo ${T.activo} s y el resto es recuperación. E90S: pon 90 en “Cada”.</div>
  </section>`;
}
function tElapsed() { return T.acc + (T.running ? (Date.now() - T.start) / 1000 : 0); }
let actx = null;
function beep(freq=880, dur=.18) {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = freq; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(.25, actx.currentTime); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + dur);
    o.start(); o.stop(actx.currentTime + dur); } catch(e) {}
}
function paintTimer() {
  const el = $('#t-clock'); if (!el) return;
  const total = T.intervalo * T.rondas, e = Math.min(tElapsed(), total);
  const ronda = Math.min(T.rondas, Math.floor(e / T.intervalo) + 1);
  const inInt = e - (ronda-1) * T.intervalo;
  const done = e >= total;
  const work = !done && inInt < T.activo;
  const left = done ? 0 : work ? T.activo - inInt : T.intervalo - inInt;
  const s = Math.ceil(left);
  el.textContent = `${Math.floor(s/60)}:${pad2(s%60)}`;
  const ph = $('#t-phase');
  const phase = done ? 'done' : (T.running || T.acc) ? (work ? 'work' : 'rest') : 'idle';
  ph.textContent = {done:'Terminado', work:'Trabajo', rest:'Recupera', idle:'Listo'}[phase];
  ph.className = 'phase ' + (phase === 'work' ? 'work' : 'rest');
  $('#t-round').textContent = `Ronda ${ronda} / ${T.rondas}`;
  $('#t-bar').style.width = (100 * e / total) + '%';
  if (T.running && phase !== T.lastPhase) { if (phase === 'work') beep(1046,.25); else if (phase === 'rest') beep(660,.2); else if (phase === 'done') { beep(523,.5); } }
  T.lastPhase = phase;
  if (done && T.running) { T.acc = total; T.running = false; const b = $('#t-start'); if (b) b.textContent = 'Iniciar'; releaseLock(); }
}
async function getLock() { try { T.lock = await navigator.wakeLock?.request('screen'); } catch(e) {} }
function releaseLock() { try { T.lock?.release(); } catch(e) {} T.lock = null; }
setInterval(() => { if (T.running) paintTimer(); }, 200);

VIEWS.alumnos = () => {
  const q = norm(S.ui.alumnosQ), F = S.ui.alumnosF;
  let list = [...S.alumnos.values()].sort((x,y) => norm(x.nombre).localeCompare(norm(y.nombre)));
  list = list.filter(a => F === 'todos' ? true : F === 'inactivos' ? a.estado === 'inactivo' : a.estado !== 'inactivo');
  if (F === 'riesgo') list = list.filter(a => riesgo(a));
  if (F === 'sinprog') list = list.filter(a => !progEstado(a));
  if (F === 'progfin') list = list.filter(a => progEstado(a)?.terminado);
  if (F === 'progpronto') list = list.filter(a => { const fin = progFin(a), t = today(); return fin && fin >= t && diffDays(t, fin) <= 7; });
  if (F === 'lesion') list = list.filter(a => (a.ingreso?.lesiones || []).length || (a.ingreso?.parq || []).length);
  if (q) list = list.filter(a => norm(a.nombre).includes(q) || norm(a.codigo).includes(q));

  <div class="vhead">
    <div><h1>Alumnos</h1><p>${list.length} en la lista · consumo del ciclo actual de cada plan.</p></div>

    <thead><tr><th>Alumno</th><th>Horario</th><th class="r">Clases</th><th class="r">Usadas</th><th class="r">Disponibles</th><th class="r">Asistencia</th><th>Plan</th><th></th></tr></thead>
    <tbody>
    ${list.length ? list.map(a => {
      const p = planActual(a); const tot = p?.clases || a.clases;
      const as = p?.inicio ? asistencias(a.codigo, p.inicio, p.fin) : {pres:0, aus:0};
      const pct = as.pres + as.aus ? Math.round(100 * as.pres / (as.pres + as.aus)) + ' %' : 'Sin registro';
      return `<tr class="click" data-act="ficha" data-id="${esc(a.codigo)}">
        <td><b>${esc(a.nombre)}</b><span class="sub">${esc(a.codigo)}${a.estado === 'inactivo' ? ' · inactivo' : ''}${(() => { const pg = progEstado(a); return pg ? ' · ' + esc(progTexto(pg)) + ' · sem ' + Math.min(pg.semana, pg.total) + '/' + pg.total + (pg.terminado ? ' ✓' : '') : ''; })()}</span></td>
        <td class="small">${esc(bloquesTexto(a))}</td>
        <td class="r num">${tot || '—'}${p?.inicio ? `<span class="sub">${fmtD(p.inicio)}–${fmtD(p.fin)}</span>` : ''}</td>
        <td class="r num">${as.pres}</td>
        <td class="r num">${tot ? Math.max(0, tot - as.pres) : '—'}</td>
        <td class="r num">${pct}</td>
        <td>${pill(vigencia(a,p))}</td>
        <td class="r"><span class="muted">›</span></td></tr>`; }).join('')
    : `<tr><td colspan="8" class="empty">${S.alumnos.size ? 'Nadie coincide con la búsqueda.' : 'Aún no hay alumnos. Agrega el primero con “Nuevo alumno”.'}</td></tr>`}
    </tbody></table></div>`;
};
function riesgo(a) {
  if (a.estado === 'inactivo') return false;
  const fechas = [...S.dias.keys()].sort(); if (!fechas.length) return false;
  const t = today();
  if (diffDays(fechas[0], t) < 10) return false;
  if (!(a.bloques||[]).length) return false;
  return asistencias(a.codigo, addDays(t, -10), t).pres === 0;
}

VIEWS.workouts = () => {
  const q = norm(S.ui.wkQ), N = S.ui.wkNivel, CAT = S.ui.wkCat;
  const all = [...S.rutinas.entries()];
  const cnt = k => all.filter(([,r]) => k === 'todas' || catOf(r) === k).length;
  let list = all;

  list.sort((a,b) => rutOrder(a[1], b[1]));

  </div>
  ${CAT === 'Rehabilitación y prevención' ? `<div class="notice" style="font-weight:500"><b>Ejercicio terapéutico basado en estudios.</b> Cada lesión avanza en 3 fases (Básico = Fase 1, Intermedio = Fase 2, Avanzado = Fase 3); los programas Prehab son para fortalecer articulaciones y prevenir. Usa la regla de dolor (máximo 3/10) y no reemplaza la evaluación de un kinesiólogo o médico.</div>` : ''}
  ${fams.length ? fams.map(({fam, cat, items}) => `
    <section style="display:grid;gap:10px">
      <div><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-end;flex-wrap:wrap"><div><div class="eyebrow">${esc(cat)}</div><h2 style="font-size:22px">${esc(fam)}</h2></div><button class="btn sm" data-act="asig-prog" data-fam="${esc(fam)}">Asignar a alumnos (${activos().filter(a => a.programa?.familia === fam).length})</button></div>${items[0][1].guia ? `<p class="small muted" style="margin:2px 0 0">${esc(String(items[0][1].guia).split('. ')[0])}.</p>` : ''}</div>

        <div class="body">${rutinaBody(r)}${r.guia ? `<p class="small muted" style="margin:0">${esc(r.guia)}</p>` : ''}${progHTML(r)}
          <div class="tools"><button class="btn sm" data-act="editar-wk" data-id="${esc(id)}">Editar</button><button class="btn sm" data-act="duplicar-wk" data-id="${esc(id)}">Duplicar</button></div></div>

VIEWS.registro = () => {
  const c = cfg(), f = S.ui.regFecha;
  const hs = c.horas.filter(h => roster(f,h).length || Object.keys(S.dias.get(f)?.bloques?.[h]||{}).length);
  const mes = f.slice(0,7);
  const ultimo = new Date(+mes.slice(0,4), +mes.slice(5,7), 0).getDate();
  const counts = [];
  for (let d = 1; d <= ultimo; d++) { const k = `${mes}-${pad2(d)}`; let n = 0; const dd = S.dias.get(k); if (dd) for (const h in dd.bloques||{}) for (const cd in dd.bloques[h]) if (dd.bloques[h][cd].asis === 'presente') n++; counts.push([k, n]); }
  const totalMes = counts.reduce((s,x) => s + x[1], 0);
  const max = Math.max(4, ...counts.map(x => x[1]));
  const W = 620, H = 140, pl = 26, pb = 22, bw = (W - pl - 6) / counts.length;
  const ticks = [0, Math.round(max/2), max];
  const chart = `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Asistencias por día en ${esc(fmtMes(mes))}">
    ${ticks.map(tk => { const y = H - pb - (H - pb - 10) * tk / max; return `<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)">${tk}</text>`; }).join('')}
    ${counts.map(([k,n],i) => { const h = (H - pb - 10) * n / max; const x = pl + 3 + i*bw; return `<rect x="${x}" y="${H-pb-h}" width="${Math.max(2,bw-3)}" height="${h}" rx="2" fill="${k === f ? 'var(--red)' : 'var(--muted)'}" opacity="${k === f ? 1 : .55}"><title>${fmtD(k)}: ${n}</title></rect>${(i+1) % 5 === 0 || i === 0 ? `<text x="${x + bw/2}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--muted)">${i+1}</text>` : ''}`; }).join('')}
  </svg>`;
  return `
  <div class="vhead">
    <div><h1>Registro</h1><p>Revisa y corrige asistencias de cualquier día. La clase en curso se marca en “Clase de hoy”.</p></div>
    <div class="tools"><input type="date" id="r-fecha" value="${f}" aria-label="Fecha"></div>
  </div>
  <section class="card pad" style="display:grid;gap:8px">
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div class="eyebrow">Asistencias en ${esc(fmtMes(mes))}</div><b class="num">${totalMes} en el mes</b></div>
    ${chart}
  </section>
  <section style="display:grid;gap:12px">
    <h2 style="font-size:22px">${esc(longDate(f))}</h2>
    ${hs.length ? hs.map(h => { const codes = roster(f,h); return `<div class="card pad" style="display:grid;gap:4px">
      <div style="display:flex;justify-content:space-between;align-items:center"><b class="num" style="font-family:var(--display);font-size:22px">${esc(h)}</b><span class="small muted num">${codes.filter(cd => rec(f,h,cd).asis === 'presente').length} de ${codes.length} presentes</span></div>
      <div class="list">${codes.map(cd => { const r = rec(f,h,cd), key = f+'|'+h+'|'+cd; return `<div class="li"><span class="grow">${esc(nombre(cd))}${r.notas ? `<span class="sub small muted">${esc(r.notas)}</span>` : ''}</span>
        <button class="btn sm ${r.asis === 'presente' ? 'on-ok' : ''}" data-act="asis" data-v="presente" data-k="${esc(key)}">Presente</button>
        <button class="btn sm ${r.asis === 'ausente' ? 'on-crit' : ''}" data-act="asis" data-v="ausente" data-k="${esc(key)}">Ausente</button></div>`; }).join('')}</div></div>`; }).join('')
    : `<div class="card empty">No hay bloques con alumnos ese día.</div>`}
  </section>
  <section class="grid2">
    <div class="card pad" style="display:grid;gap:10px;align-content:start">
      <div class="eyebrow">Datos y respaldo</div>
      <h2 style="font-size:22px">Respaldo completo</h2>
      <p class="muted" style="margin:0">Descarga todos tus alumnos, planes, pagos, asistencias y rutinas en un archivo. Guárdalo de vez en cuando por seguridad.</p>
      <div class="tools"><button class="btn pri" data-act="respaldo">Descargar respaldo</button><button class="btn" data-act="exportar-csv">Pagos en CSV</button><button class="btn ghost" onclick="window.tlLogout && window.tlLogout()">Cerrar sesión</button></div>
    </div>
    <form class="card pad" id="ajustes" style="display:grid;gap:12px">
      <div class="eyebrow">Ajustes</div>
      <div class="frow">
        <label class="f">Nombre del coach<input type="text" id="aj-coach" value="${esc(c.coach)}"></label>
        <label class="f">Lema<input type="text" id="aj-lema" value="${esc(c.lema)}"></label>
      </div>
      <div class="frow">
        <label class="f">Cupos por bloque<input type="number" id="aj-cupos" min="1" value="${c.cupos}"></label>
        <label class="f">Días del plan<input type="number" id="aj-ciclo" min="1" value="${c.cicloDias}"></label>
      </div>
      <label class="f">Horas de los bloques (separadas por coma)<input type="text" id="aj-horas" value="${esc(c.horas.join(', '))}"></label>
      <fieldset style="border:0;padding:0;margin:0;display:grid;gap:6px"><legend class="small muted" style="font-weight:600;margin-bottom:4px">Días con clases</legend>
        <div class="chips">${['lun','mar','mie','jue','vie','sab'].map(d => `<label class="chip"><input type="checkbox" name="aj-dia" value="${d}" ${c.dias.includes(d) ? 'checked' : ''} style="accent-color:var(--red)"> ${DNAME[d]}</label>`).join('')}</div></fieldset>
      <div><button class="btn pri" type="submit">Guardar ajustes</button></div>
    </form>
  </section>`;
};

function abrirMesModal(mes) {

    const u = ultimo(a);

  const ya = al.length - cand.length;

  else if (mode === 'renovar') { const ini = cur?.fin && cur.fin >= addDays(t, -14) ? cur.fin : t; p = {id: 'p'+Date.now().toString(36), inicio: ini, fin: addDays(ini, c.cicloDias), monto: cur?.monto || '', clases: cur?.clases || a.clases || '', pagos: []}; }
  else p = {id: 'p'+Date.now().toString(36), inicio: t, fin: addDays(t, c.cicloDias), monto: '', clases: a.clases || '', pagos: []};

    onSubmit: () => {

      if (mode === 'editar') np.pagos = p.pagos;

      fresh.planes = (fresh.planes||[]).filter(x => x.id !== np.id).concat([np]);

const fotoURL = id => id ? (window.tlFotoURL ? window.tlFotoURL(id) : '/_blob/' + id) : '';
function achicarFoto(file, max = 1400) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); c.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/jpeg', 0.82); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
async function subirFoto(code, fecha, ang, file, slot) {
  if (!assets) { toast('Las fotos no están disponibles en esta vista.', true); return; }
  slot?.classList.add('busy');
  try {
    const blob = await achicarFoto(file);
    const up = await assets.upload(blob);
    const a = clone(S.alumnos.get(code)); const fs = a.fotos || [];
    let row = fs.find(x => x.f === fecha); if (!row) { row = {f: fecha}; fs.push(row); }
    const viejo = row[ang]; row[ang] = up.id;
    a.fotos = fs.sort((x, y) => x.f.localeCompare(y.f)); saveAlumno(a);
    if (viejo) assets.delete(viejo).catch(() => {});
    S.ui.fotosOpen = true; S.ui.fotoFecha = fecha; toast('Foto guardada.'); progresoModal(code);
  } catch(e) { slot?.classList.remove('busy'); toast('No se pudo subir la foto. Intenta de nuevo.', true); }
}

async function saveFile(filename, data) {

function csvPagos() {
  const rows = [['Código','Alumno','Mes','Inicio','Renueva','Clases','Monto','Abonado','Saldo','Estado pago']];
  for (const a of S.alumnos.values()) for (const p of a.planes||[]) rows.push([a.codigo, a.nombre, p.mes||'', p.inicio||'', p.fin||'', p.clases||'', p.monto||0, abonado(p), saldo(p), pagoEstado(p).l]);
  return rows.map(r => r.map(x => `"${String(x).replace(/"/g,'""')}"`).join(';')).join('\n');
}

document.addEventListener('change', e => {
  const t = e.target;
  if (t.classList?.contains('inb-in') && t.files?.[0]) { subirInbody(t.dataset.id, $('#inb-fecha')?.value || today(), t.files[0], t); }
  else if (t.classList?.contains('foto-in') && t.files?.[0]) { const f = $('#foto-fecha')?.value || today(); subirFoto(t.dataset.id, f, t.dataset.ang, t.files[0], t.closest('.f-slot')); }
  else if (t.id === 'foto-fecha') { S.ui.fotoFecha = t.value || today(); S.ui.fotosOpen = true; const code = t.closest('.fotos')?.querySelector('.foto-in')?.dataset.id; if (code) progresoModal(code); }
  else if (t.id === 'foto-a' || t.id === 'foto-b') { const id = t.dataset.id; S.ui.fotoCmp = Object.assign({}, S.ui.fotoCmp?.code === id ? S.ui.fotoCmp : {code: id}, {[t.id === 'foto-a' ? 'a' : 'b']: t.value}); S.ui.fotosOpen = true; progresoModal(id); }
});
document.addEventListener('toggle', e => { if (e.target.classList?.contains('fotos')) S.ui.fotosOpen = e.target.open; }, true);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (T.running) getLock(); schedule(); } });
setInterval(() => { if (!document.hidden && S.view === 'inicio' && $('#modal').hidden && !$('#view').contains(document.activeElement)) render(); }, 60000);

let toastT = 0;
function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }

/* ---------- actualización de la biblioteca de workouts ---------- */
const LIB_VER = 3; let libMig = false;
async function maybeMigrateLib() {
  if (libMig || !db || !S.loaded.rutinas || !S.loaded.cfg) return;
  if ((Number(cfg().libVer) || 0) >= LIB_VER) return;
  libMig = true;
  try {
    const res = await fetch('biblioteca-v3.json', {cache: 'no-store'});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const lib = await res.json();
    const put = async (id, d) => { S.rutinas.set(id, d); for (let k = 0; k < 3; k++) { try { await db.doc('rutinas/' + id).set(clone(d)); return; } catch (e) { await new Promise(r => setTimeout(r, 800 * (k + 1))); if (k === 2) throw e; } } };
    toast('Actualizando la biblioteca de workouts…');
    let n = 0;
    const same = (a, b) => a && JSON.stringify([a.tipo, a.bloques, a.progresion]) === JSON.stringify([b.tipo, b.bloques, b.progresion]);
    for (const [id, d] of Object.entries(lib.docs)) { const prev = S.rutinas.get(id); if (same(prev, d)) continue; await put(id, Object.assign({}, d, {favorito: !!(prev && prev.favorito)})); n++; }
    for (const [id, p] of Object.entries(lib.patches)) {
      const prev = S.rutinas.get(id); if (!prev) continue;
      if (Array.isArray(prev.progresion) && prev.progresion.length && !(p.repl || []).some(r => JSON.stringify(prev.bloques).includes(JSON.stringify(r[0])))) continue;
      const nd = clone(prev); nd.progresion = p.progresion;
      (nd.bloques || []).forEach(b => (b.ejercicios || []).forEach(e => { const r = (p.repl || []).find(x => x[0] === e.nombre); if (r) { e.nombre = r[1]; if (r[2]) e.dosis = r[2]; } }));
      await put(id, nd); n++;
    }
    saveCfg(Object.assign({}, S.cfg || {}, {libVer: LIB_VER}));
    schedule(); toast(`Biblioteca actualizada: ${n} workouts con progresión semanal.`);
  } catch (e) { console.error(e); libMig = false; toast('No se pudo actualizar la biblioteca de workouts. Recarga la página.', true); }
}

/* ---------- boot ---------- */
route();
(async () => {
  try { db = await window.claude?.use?.('db'); } catch(e) { db = null; }
  try { downloads = await window.claude?.use?.('downloads'); } catch(e) { downloads = null; }
  try { assets = await window.claude?.use?.('assets'); } catch(e) { assets = null; }
  if (!db) { S.dbState = 'none'; render(); return; }
  S.dbState = 'ok';
  const fail = e => { console.error(e); toast('Se perdió la conexión con tus datos. Recarga la página.', true); };
  db.collection('alumnos').onSnapshot(s => { S.alumnos = new Map(s.docs.map(d => [d.id, clone(d.data())])); S.loaded.alumnos = true; schedule(); }, fail);
  db.collection('rutinas').onSnapshot(s => { S.rutinas = new Map(s.docs.map(d => [d.id, clone(d.data())])); S.loaded.rutinas = true; schedule(); maybeMigrateLib(); }, fail);
  db.collection('dias').onSnapshot(s => { S.dias = new Map(s.docs.map(d => [d.id, clone(d.data())])); S.loaded.dias = true; schedule(); }, fail);
  db.doc('config/general').onSnapshot(d => { S.cfg = d.exists ? clone(d.data()) : null; S.loaded.cfg = true; schedule(); maybeMigrateLib(); }, fail);
})();
})();
</script>
